# Recommended additions to <bench>/config/redis_queue.conf (the bench's own file; nothing here is applied for you).
# bench writes this file without any persistence or memory policy, so Redis falls back to its defaults.

# Job data is the queue itself: it must never be evicted to make room.
maxmemory-policy noeviction

# No snapshots, no append-only file. A restarted queue Redis comes back EMPTY. That is deliberate:
#  * a snapshot restored after a crash resurrects jobs that were already done (seen on this bench: jobs queued before a
#    snapshot reappear as "queued" after the restart) and runs them again;
#  * everything that matters is recoverable without the queue: a lost automatic MRP job leaves a Queued run that the hourly
#    recovery (tasks.recover_stuck_mrp_runs) calculates again, and every PPC job is idempotent.
save ""
appendonly no

# Notice a dead peer (a worker killed with its connection open) instead of holding the socket for hours.
tcp-keepalive 60
timeout 0
